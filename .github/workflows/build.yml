name: APK Derle
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i ac
        run: unzip -q Huzur-Android-Projesi.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Derle
        working-directory: Huzur
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Huzur-APK
          path: Huzur/app/build/outputs/apk/debug/app-debug.apk
